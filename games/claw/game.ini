# Captain Claw (Monolith, 1997) with the CrazyHook 1.4.5.4 community pack.
# Key names: UP DOWN LEFT RIGHT CTRL SHIFT ALT SPACE ENTER ESC TAB F1..F24, a letter
# or digit, or a number (0x11).  A <save dir>/game.ini overrides any of this at runtime.

[game]
title       = Captain Claw
short_name  = Claw
exe         = CLAW.exe
guest_dir   = C:\CLAW
required    = CLAW.exe CrazyHook.lua Assets
files_hint  = CLAW.exe, CrazyHook.lua, Assets, Custom, ...

[android]
app_id      = com.clawport.game
app_name    = Captain Claw
copy_skip   = Shaders .vscode

[recomp]
# CrazyHook's startup script writes these bytes into the game's code; they are
# applied before recompiling (the original exe is still what gets verified).
patch_lua   = Assets/GAME/MODULES/asm_crazy_patches.lua Assets/GAME/MODULES/game_controls_dialog.lua
# Game functions the scripts call through FFI function pointers.
seed_lua    = CrazyHook.lua Assets/GAME/MODULES Custom Plugins
# Code the scripts rewrite at run time (cheats, custom levels): those immediates are read from memory.
dyn_lua     = CrazyHook.lua CrazyHookConsts.lua Assets Custom Plugins
# Guest functions replaced by host code (standard CRT routines only).
override    = 0x4a6db0 host_memmove   # CRT memcpy (overlap-safe, jump tables)
override    = 0x4a7360 host_memmove   # CRT memmove
probe       =

[input]
# A press is held at least this long (the game samples keys once per frame).
min_hold_ms = 80
# Menu vs gameplay: Claw polls its action keys (GetAsyncKeyState) only in gameplay;
# menus, dialogs and movies read key messages instead.
gameplay_poll = CTRL SPACE ALT SHIFT
gameplay_window_ms = 500
dirs        = UP DOWN LEFT RIGHT

# Claw's default keys: arrows move, SPACE jump, CTRL attack, ALT projectile,
# SHIFT switch projectile, Z lift/throw, 1-3 pistol/magic/dynamite, ESC game menu.
[touch]
# button = LABEL KEY CONTEXT X Y RADIUS   (units of screen height; X from the right edge,
# negative X from the left; Y > 0.12 from the bottom, otherwise from the top)
button = JUMP   SPACE  game 0.14 0.20 0.100
button = ATTACK CTRL   game 0.33 0.14 0.080
button = FIRE   ALT    game 0.12 0.44 0.075
button = LIFT   Z      game 0.32 0.36 0.065
button = SWAP   SHIFT  game 0.12 0.64 0.055
button = PISTOL 0x31   game 0.33 0.56 0.045
button = MAGIC  0x32   game 0.33 0.68 0.045
button = DYN    0x33   game 0.33 0.80 0.045
button = OK     ENTER  menu 0.20 0.20 0.100
button = BACK   ESC    menu 0.08 0.42 0.080
button = |      ESC    all  -1   0.08 0.050
button = CHEATS CHEATS all  0.30 0.07 0.050

# Controllers: any pad SDL knows, by Xbox layout names.
# The left stick and the d-pad move; CHEATS opens the cheat menu.
[pad.game]
a = SPACE
b = ALT
x = CTRL
y = SHIFT
leftshoulder  = Z
rightshoulder = SHIFT
lefttrigger   = Z
righttrigger  = ALT
start = ESC
back  = CHEATS
leftstick  = 0x31
rightstick = 0x33

[pad.menu]
a = ENTER
b = ESC
x = ENTER
y = ESC
start = ENTER
back  = CHEATS
# dialogs (custom level picker...): move between the controls
leftshoulder  = TAB
rightshoulder = TAB

[cheats]
# The cheat menu (CHEATS key: pad Back/Select, the touch CHEATS button, F12 on a keyboard).
# Entries come from the game's own cheat table at run time (built-in, CrazyHook and
# custom-level cheats); a chosen cheat is posted to the game as WM_COMMAND <id>.
#   map = <address of nResult pointer> <offset of the cheat manager> <offset of its map>
map         = 0x535910 0x48 4
name_shift  = 15
note        = Cheats work during gameplay. A game played with cheats is not saved.
# Labels (from the game's own messages where it has one) and sections, in menu order.
section = Player
cheat = MPKFA         God mode
cheat = MPAPPLE       Full health
cheat = MPLOADED      Full ammo
cheat = MPGANDOLF     Full magic
cheat = MPBLASTER     Full dynamite
cheat = MPPLAYALLDAY  Infinite lives
cheat = MPARMOR       Anti death-tile mode
cheat = MPVADER       Invincibility power-up
cheat = MPCASPER      Invisibility power-up
cheat = MPFREAK       Catnip power-up
cheat = MPBUNZ        Roids mode
cheat = MPJORDAN      Super jump mode
cheat = MPMOONGOODIES Moon goodies mode
cheat = MPSUPERTHROW  Super throw mode
cheat = MPLONGRANGE   Long range attack mode
cheat = MPHOTSTUFF    Fire sword
cheat = MPPENGUIN     Ice sword
cheat = MPFRANKLIN    Lightning sword
cheat = MPPEJTI       Plasma sword
cheat = MPFLY         Fly mode
cheat = MPWISZTOM     Set respawn point here
section = Difficulty
cheat = MPEASYMODE    Easy mode
cheat = MPWIMPY       Wimp mode
cheat = MPCULTIST     Strong enemy mode
cheat = MPGONZALO     One HP mode
cheat = MPTWINTURBO   Twin sequential turbo mode
cheat = MPNDJ         No double jump mode
cheat = MPARTUR       Artur mode
cheat = MPBUTTER      No block mode
section = Level warp
cheat = MPCHEESESAUCE    Level 1 - La Roca
cheat = MPEXACTLY        Level 2 - Battlements
cheat = MPRACEROHBOY     Level 3 - Footpath
cheat = MPBUDDYWHAT      Level 4 - Dark Woods
cheat = MPMUGGER         Level 5 - Township
cheat = MPGOOFCYCLE      Level 6 - Puerto Lobos
cheat = MPROTARYPOWER    Level 7 - Docks
cheat = MPSHIBSHANK      Level 8 - Shipyards
cheat = MPWHYZEDF        Level 9 - Pirates Cove
cheat = MPSUPERHAWK      Level 10 - Cliffs
cheat = MPJOBNUMBER      Level 11 - Caverns
cheat = MPLISTENANDLEARN Level 12 - Undersea Caves
cheat = MPYEAHRIGHT      Level 13 - Tiger Island
cheat = MPCLAWTEAMTULEZ  Level 14 - Temple
section = Display
cheat = MPFPS         Frame rate display
cheat = MPPOS         World position display
cheat = MPSTOPWATCH   Elapsed time display
cheat = MPSPEEDRUN    Speedrun stopwatch
cheat = MPTHANOS      Health bars display
cheat = MPBOUNCECOUNT Object count display
cheat = MPBOUNCECOUNTER Bounce counter
cheat = MPSIMPSON     Double jump feedback display
cheat = MPTOPLESS     Toggle the top plane
cheat = MPMIDLESS     Toggle the middle plane
cheat = MPBOTTOMLESS  Toggle the background plane
cheat = MPRECTS       Debug rectangles
cheat = MPMOREDI      More debug info (with MPRECTS)
cheat = MPTEXT        Debug text
cheat = MPTILES       Debug tiles
section = Fun
cheat = MPGLOOMY      Old TV look
cheat = MPALICE       Random colours
cheat = MPSPOOKY      Ghost Claw
cheat = MPSHADOW      Shadow Claw
cheat = MPHAUNTED     Haunted level
cheat = MPWILDWACKY   Wild, wacky stuff
cheat = MPKIJAN       Disco
cheat = MPBORIS       Boris mode
cheat = MPPAPPY       Pappy mode
cheat = MPAZZAR       HD mode
cheat = MPMONOLITH    Monolith rules
cheat = MPDEVHEADS    Those crazy developers
cheat = MPGOBLE       Credit to Brian L. Goble
cheat = MPZAX         Credit to Zax37
section = Sound & video
cheat = MPMAESTRO     Faster music
cheat = MPLANGSAM     Slower music
cheat = MPNORMALMUSIC Normal music
cheat = MPJAZZY       Low resolution (320x200) toggle
cheat = MPINCVID      Higher resolution
cheat = MPDECVID      Lower resolution
cheat = MPDEFVID      Default resolution (640x480)

[widescreen]
# Port option (cheat menu > Display): during gameplay, a resolution as wide as the screen
# at 480 lines, through CrazyHook's ChangeResolution: nRes (0x535910) +0x7c/+0x80 hold the
# resolution, WM_COMMAND 0x901 (ChangeResWrapper) applies it.
object  = 0x535910
width   = 0x7c
height  = 0x80
command = 0x901
base    = 640x480
default = 0

[pack]
# rule = GLOB HANDLER (first match wins; globs match the path in the game folder, any case)
rule = .vscode/*            skip    # editor settings
rule = Shaders/*            skip    # cnc-ddraw shaders (not used: the port renders itself)
rule = *.dll                skip    # Windows DLLs: the port implements them (CrazyHook, Lua, Miles, Smacker, ddraw...)
rule = cnc-ddraw config.exe skip
rule = desktop.ini          skip
rule = *.avi                stored  # Xvid/MP3 movies: already compressed
rule = CLAW.FEC             stored  # Smacker videos: already compressed
rule = *.mp3                stored
rule = CLAW.exe             lzma
rule = *.wwd                lzma    # levels (zlib inside): on their own
rule = *                    solid   # images, sounds, animations, scripts: per folder
